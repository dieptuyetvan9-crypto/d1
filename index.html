<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Huệ - Chánh Kiến - Audio Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <h2 id="status-msg">Đang nạp danh sách nhạc từ hệ thống...</h2>
        
        <div class="player-wrapper">
            <h3 id="song-title">Chưa chọn bài hát</h3>
            
            <!-- Google Drive Player Preview Iframe -->
<!-- Cập nhật thuộc tính height từ 60 thành 120 -->
<iframe id="audio-player" width="100%" height="120" frameborder="0" allow="autoplay" onload="handleIframeAutoNext()"></iframe>

        </div>

        <div class="controls">
            <button id="prev-btn" class="control-btn-large" onclick="prevTrack()">⏮</button>
            <button id="next-btn" class="control-btn-large" onclick="nextTrack()">⏭</button>
        </div>

        <!-- Ô tìm kiếm bài hát với chữ hiển thị gợi ý mới -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm kiếm bài..." oninput="filterSongs()">
        </div>
<!-- THANH NGANG ĐIỀU KHIỂN NHẠC NỀN (MẶC ĐỊNH BẬT SẴN TRÊN GIAO DIỆN) -->
<div class="bg-music-bar playing" id="bg-music-btn">
    <div class="bg-music-left">
        <span class="bg-music-status">🎵 Nhạc nền: Đang Bật</span>
    </div>
    <div class="bg-music-right">
        <!-- Ngăn sự kiện click lan ra ngoài khi kéo thanh trượt chỉnh âm lượng -->
        <div class="bg-volume-container" onclick="event.stopPropagation();">
            <span class="volume-icon">🔊</span>
            <input type="range" id="bg-volume-slider" min="0" max="1" step="0.05" value="0.1">
        </div>
        <div class="bg-music-indicator"></div>
    </div>
</div>

<!-- Thẻ Audio ngầm ẩn xử lý âm thanh độc lập -->
<audio id="bg-audio" preload="auto"></audio>

<!-- Cập nhật thẻ chứa Dashboard của bạn thành dạng có thể click như sau -->
<div id="counter-dashboard" class="counter-dashboard" onclick="toggleSongCountDisplay()" style="cursor: pointer; user-select: none;" title="Click để Ẩn/Hiện số lượng bài hát">
    <span>📂 Danh mục: <span id="total-folders">0</span></span>
    <span>🎵 Tổng số: <span id="total-songs">0</span></span>
</div>

<!-- Đảm bảo bên dưới KHÔNG còn nút bấm id="toggle-count-btn" cũ nữa -->
<div id="playlist-wrapper"></div>



        <!-- Khu vực số liệu thống kê nằm ngay dưới ô tìm kiếm bài -->

        <div id="playlist-wrapper">
            <!-- Danh sách bài hát phân loại theo thư mục sẽ được tự động dựng ở đây -->
        </div>
    </div>

    <script src="playlist.js"></script>
</body>
</html>
